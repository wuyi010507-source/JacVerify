[project]
name = "jacverify"
version = "0.1.0"
description = "Evidence-driven verification decision intelligence built with Jac"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

[dependencies]

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"
pytest = "~=9.1"

[serve]
base_route_app = "app"
port = 8000

[test]
verbose = true

[byllm.call_params]
temperature = 0.1
max_output_retries = 2

[client.app_meta_data]
title = "JacVerify"
description = "Evidence-driven verification decision intelligence"
theme_color = "#07111f"
