[project]
name = "jacverify"
version = "0.1.0"
description = "Evidence-driven verification decision intelligence built with Jac"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

[dependencies]

[dependencies.npm]
jac-client-node = "1.0.7"

[dependencies.npm.dev]
"@jac-client/dev-deps" = "1.0.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"
port = 8000

[test]
verbose = true

[client.app_meta_data]
title = "JacVerify"
description = "Evidence-driven verification decision intelligence"
theme_color = "#07111f"

